[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imperfectlab"
version = "0.1.0"
description = "Make custom characters for Marvel Nemesis: Rise of the Imperfects (GameCube) and share them as .imperfect files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.1", "PySide6>=6.6"]

[project.scripts]
imperfectlab = "imperfectlab.__main__:main"

[tool.setuptools.packages.find]
include = ["imperfectlab*"]

[tool.setuptools.package-data]
imperfectlab = ["model/skeletons/*.json", "vendor/mnroi/*.md", "vendor/mnroi/LICENSE"]
